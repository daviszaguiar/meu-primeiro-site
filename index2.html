<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Teste no Vercel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #000000 0%, #111111 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #0070f3, #f000ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    button {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255,255,255,0.2);
    }
    .counter {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #0070f3;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🚀 Vercel Test App</h1>
    <p>Seu deploy funcionou perfeitamente!</p>
    <button id="btn">Clique aqui!</button>
    <div class="counter" id="counterText">Cliques: 0</div>
  </div>

  <script>
    let count = 0;
    const btn = document.getElementById('btn');
    const counterText = document.getElementById('counterText');

    btn.addEventListener('click', () => {
      count++;
      counterText.textContent = `Cliques: ${count}`;
      if (count === 5) {
        alert('🎉 O JavaScript também está funcionando!');
      }
    });
  </script>
</body>
</html>
